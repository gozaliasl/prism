n_lenses: 10
n_non_lenses: 0
variations_per_base: 10
n_field_max: 5
ml_training:
  standard:
    n_lenses: 50000
    n_non_lenses: 50000
    variations_per_base: 115
    description: Standard ML training dataset with empirical variations
  large_scale:
    n_lenses: 100000
    n_non_lenses: 100000
    variations_per_base: 230
    description: Large-scale ML training dataset for robust models
  quick:
    n_lenses: 10000
    n_non_lenses: 10000
    variations_per_base: 23
    description: Quick ML training dataset for testing
  production:
    n_lenses: 5000
    n_non_lenses: 5000
    variations_per_base: 12
    description: Production dataset for paper validation
image_size: 300
pixel_scale: 0.031
multi_resolution:
  enabled: false
  scales:
  - name: ground_based
    pixel_scale: 0.2
    description: Ground-based resolution
  - name: roman
    pixel_scale: 0.11
    description: Roman Space Telescope resolution
  - name: euclid
    pixel_scale: 0.1
    description: Medium resolution (Euclid)
  - name: jwst
    pixel_scale: 0.031
    description: High resolution (JWST)
sersic_range:
- 0.3
- 6.0
magnitude_range:
- 18.0
- 28.0
morphology:
  multicomponent_enabled: true
  apply_to_lens: true
  apply_to_source: true
  components:
    bulge:
      n_sersic: 4.0
      r_frac: 0.25
      q_boost: 0.3
    disk:
      n_sersic: 1.0
      r_frac: 1.0
      r_frac_source: 1.15
    bar:
      n_sersic: 0.5
      r_frac: 0.4
      q: 0.25
    ring:
      n_sersic: 0.5
      r_frac: 0.8
    bulge_secondary:
      n_sersic: 4.0
      r_frac: 0.6
      offset_frac:
      - 0.3
      - 0.8
  bt_fractions:
    elliptical: 0.9
    s0: 0.85
    spiral: 0.175
    late_spiral: 0.14
    barred_spiral: 0.14
    edge_on: 0.21
    ring: 0.14
    post_merger: 0.175
  band_weight_bulge_like:
    F115W: 1.0
    F150W: 1.0
    F200W: 1.0
    F277W: 1.0
    F356W: 1.0
    F444W: 1.0
photometry:
  lens_mag_min: 18.0
  lens_mag_max: 24.0
  source_mag_min: 19
  source_mag_max: 27.5
  min_source_fainter_than_lens_mag: 1.2
  source_mag_diff_min: 1.0
  source_mag_diff_max: 3.5
  lens_base_mag_zero: 21.0
  lens_redshift_log_slope: 0.8
  source_base_mag: 20.5
catalogs:
  galaxy_catalog: /Volumes/exthd-prism/prism-data/catalogs/cosmos/galaxy_catalog.fits
geometry:
  max_magnification: 12.0
  min_magnification: 2.0
  binary_min_magnification: 5.0
  lens_radius_min: 0.35
  lens_radius_max: 2.2
  use_catalog_lens_radius: true
  frame_radius_max_arcsec: 4.5
  min_environment_avoidance_arcsec: 0.35
  lens_size_scaling:
    r0_kpc: 5.2
    alpha_mass: 0.75
    beta_redshift: -1.2
    reference_mass: 11.2
    reference_z: 0.6
    mix_catalog_weight: 0.35
    kpc_min: 1.2
    kpc_max: 18.0
    log_scatter: 0.18
  source_fraction_mean: 0.12
  source_fraction_sigma: 0.45
  source_fraction_min: 0.02
  source_fraction_max: 0.4
  enforce_source_smaller_than_lens: true
  max_source_to_lens_ratio: 0.6
  allow_magnified_arcs_larger_than_lens: true
redshifts:
  lens_min: 0.3
  lens_max: 3.5
  source_min: 1.0
  source_max: 3.5
  enforce_source_behind_lens: true
  min_delta_z: 0.5
mass:
  lens_mass_min: 10.0
  lens_mass_max: 12.0
  use_mass_theta_E_correlation: true
subhalos:
  enabled: false
  count_range:
  - 3
  - 12
  mass_function_slope: 1.9
  mass_range_log10_host:
  - -4.5
  - -2.0
  mass_fraction_of_host: 0.01
  concentration_relation: duffy2008
  max_radius_einstein_units: 3.0
  profile: NFW
binary_lenses:
  enabled: false
  fraction: 0.35
  mass_profile_types:
    sie_sie: 0.5
    nfw_nfw: 0.5
  mass_ratio:
    min: 0.3
    max: 1.0
    distribution: uniform
  separation:
    min_in_einstein_radii: 0.5
    max_in_einstein_radii: 2.0
    distribution: uniform
  redshift_config:
    same_redshift_fraction: 0.8
    max_delta_z: 0.3
  orientation:
    random_position_angle: true
    correlated_ellipticities: true
lens_class_distribution:
  enabled: true
  single_field:
    fraction: 0.45
    description: Single field galaxy lens (SIE or NFW + optional shear)
  group:
    fraction: 0.2
    description: Group lens with multiple different mass profile types
  binary_sie_sie:
    fraction: 0.175
    description: 'Binary pair: two smooth isothermal spheres'
  binary_nfw_nfw:
    fraction: 0.175
    description: 'Binary pair: two NFW mass profiles'
  binary_shear_only:
    fraction: 0.0
    description: 'Binary pair: SIE primary plus a secondary modeled as pure external
      shear'
mass_size:
  lens_relation_mix:
    cowls_fraction: 0.4
    cwmgs_fraction: 0.6
  fallback_global:
    slope: 0.387
    intercept: -3.843
    size_evolution_exponent: -0.2
environment:
  types:
    isolated_field:
      fraction: 0.45
      galaxy_count_mean: 2.5
      galaxy_count_std: 1.2
      min_galaxies: 0
      max_galaxies: 3
      poisson_lambda: 1.4
      separation_mean: 2.5
      avoid_factor: 1.25
      max_radius_arcsec: 3.0
      shear_min: 0.01
      shear_max: 0.05
    galaxy_pair:
      fraction: 0.35
      galaxy_count_mean: 3.0
      galaxy_count_std: 1.3
      min_galaxies: 1
      max_galaxies: 4
      separation_mean: 1.8
      avoid_factor: 1.1
      max_radius_arcsec: 3.5
      shear_min: 0.03
      shear_max: 0.08
    group:
      fraction: 0.2
      galaxy_count_mean: 4.5
      galaxy_count_std: 1.6
      min_galaxies: 2
      max_galaxies: 5
      separation_mean: 1.2
      avoid_factor: 1.0
      max_radius_arcsec: 4.0
      shear_min: 0.05
      shear_max: 0.15
field:
  expected_density_per_arcsec2: 1.5
  avoid_center_arcsec: 0.3
  min_pair_separation_arcsec: 0.08
  max_fraction_of_half_size: 0.9
  min_count: 1
  size_max_arcsec: 1.2
  size_max_fraction_of_lens: 0.6
galaxygenius_stamps:
  enabled: true
  fraction: 0.6
  source_enabled: true
  source_fraction: 0.8
  source_size_scale_factor: 1.0
  lens_enabled: true
  lens_fraction: 0.6
  lens_target_size_factor: 6.0
  field_target_size_factor: 4.0
tng_mode:
  enabled: true
  sim_mode: tng_mixed
  local_catalog_path: /Volumes/exthd-prism/prism-data/catalogs/tng/tng_local_catalog/tng100-1_local_catalog.parquet
  local_catalog_path_tng50: /Volumes/exthd-prism/prism-data/catalogs/tng/tng_local_catalog/tng50-1_local_catalog.parquet
  logM_tol: 0.4
  max_attempts: 15
  require_local_particles: true
  source_logM_default: 9.5
  source_logM_scatter: 0.5
  field_enabled: true
  field_fraction: 0.4
  field_logM_default: 9.5
  field_logM_scatter: 0.6
  environment_drives_field_count: true
  particle_morphology:
    enabled: true
    min_particles: 500
    lens_enabled: true
    lens_fraction: 1.0
    source_enabled: true
    source_fraction: 1.0
    source_smooth_sigma: 1.2
    field_enabled: true
    field_fraction: 1.0
    companion_enabled: false
    companion_fraction: 0.0
    generative_enabled: true
    generative_force: false
    generative_checkpoint: src/galaxy_morphology/generative/checkpoints/cvae_v3.pt
    generative_fallback_fraction: 1.0
strict_catalog:
  use_catalog_only:
    lens: true
    source: true
    field: true
  required_fields:
  - lens_redshift
  - theta_E
  missing_policy: synthesize
  synthesize:
    magnitudes: true
    theta_E: true
    geometry: true
