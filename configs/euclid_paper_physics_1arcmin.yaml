# Euclid 1′ paper sims with COSMOS-Web field density + shear + FP physics
#
# Grounded on measured COSMOS-Web detection densities from /Volumes/exthd-prism/prism-data/catalogs/cosmos/galaxy_catalog.fits:
#   mag < 21.5 → ~10 /arcmin²
#   mag < 23.5 → ~30 /arcmin²   ← Euclid-visible field depth used here
#   mag < 24.5 → ~52 /arcmin²
#   mag < 26.0 → ~121 /arcmin²
#
# For a 1′×1′ FOV:
#   isolated (richness 1.0): N ≈ 30 ± 7
#   group (richness ~1.8):   N ≈ 54 ± 13
#
# Physics enabled:
#   • External SHEAR from environment (group γ~0.06–0.16)
#   • Fundamental Plane for σ + Re (+ blended θ_E)
#   • COSMOS-Web surface density × FOV × environment richness
#
# Run:
#   ./scripts/local/run_paper_physics_1arcmin.sh
#   ./scripts/local/run_paper_physics_1arcmin.sh --smoke

n_lenses: 10
n_non_lenses: 0
variations_per_base: 1
n_field_max: 80

telescope: euclid

euclid_q1:
  enabled: true
  data_dir: /Volumes/exthd-prism/prism-data/psf/euclid_q1
  use_empirical_psf: true
  use_population_priors: false
  use_q1_photometry: false
  use_q1_shear: false
  resample_theta_E: false
  # Explicit fallback only; env shear_min/max take precedence when
  # use_q1_shear is false and this block is absent. Keep for docs.
  # shear_range: {min: 0.05, max: 0.16}

multi_resolution:
  enabled: false

bands:
- EUCLID_VIS
- EUCLID_Y
- EUCLID_J
- EUCLID_H

redshifts:
  lens_min: 0.30
  lens_max: 0.70
  source_min: 1.0
  source_max: 2.8
  enforce_source_behind_lens: true
  min_delta_z: 0.5

mass:
  lens_mass_min: 11.2
  lens_mass_max: 12.4
  use_mass_theta_E_correlation: true

geometry:
  visible_lensed_arcs: true
  force_caustic_source_position: true
  min_magnification: 5.0
  max_magnification: 35.0
  theta_E_hard_max: 8.0
  source_fraction_mean: 0.14
  source_fraction_sigma: 0.18
  source_fraction_min: 0.05
  source_fraction_max: 0.30
  lens_radius_min: 0.6
  lens_radius_max: 3.5
  enforce_source_smaller_than_lens: true
  max_source_to_lens_ratio: 0.65

field:
  # Euclid-like visible companions (COSMOS-Web mag < 23.5 ≈ 30/arcmin²)
  density_mag_limit: 23.5
  avoid_center_arcsec: 1.5
  min_pair_separation_arcsec: 0.5
  max_fraction_of_half_size: 0.92
  size_max_arcsec: 2.0
  size_max_fraction_of_lens: 0.75
  min_count: 0

photometry:
  lens_mag_min: 17.5
  lens_mag_max: 20.5
  lens_base_mag_zero: 18.5
  lens_redshift_log_slope: 0.5
  use_catalog_lens_mags: false
  source_mag_min: 19.5
  source_mag_max: 22.5
  min_source_fainter_than_lens_mag: 1.2
  max_source_fainter_than_lens_mag: 3.0
  visible_arc_mag_diff_max: 2.5
  visible_arc_source_mag_max: 22.0
  source_mag_diff_min: 1.2
  source_mag_diff_max: 3.0
  source_base_mag: 20.8
  field_mag_limit: 23.5

morphology:
  multicomponent_enabled: true
  apply_to_lens: true
  apply_to_source: true
  native_ring_merger_geometry: false
  bt_fractions:
    elliptical: 0.95
    s0: 0.90
    spiral: 0.22
  components:
    bulge:
      n_sersic: 4.0
      r_frac: 0.28
    disk:
      n_sersic: 1.0
      r_frac: 0.85

lens_morphology:
  force_morph_type: elliptical
  min_lens_sersic: 3.8

tng_mode:
  enabled: true
  sim_mode: tng_mixed
  local_catalog_path: /Volumes/exthd-prism/prism-data/catalogs/tng/tng_local_catalog/tng100-1_local_catalog.parquet
  local_catalog_path_tng50: /Volumes/exthd-prism/prism-data/catalogs/tng/tng_local_catalog/tng50-1_local_catalog.parquet
  logM_tol: 0.50
  max_attempts: 30
  require_local_particles: false
  lens_sfr_class: quiescent
  lens_environment: group
  source_logM_default: 10.0
  source_logM_scatter: 0.4
  field_enabled: false
  # Use lens-class environment (isolated/pair/group) for field richness,
  # not the matched TNG FoF label — otherwise every SF lens inherits group N.
  environment_drives_field_count: false
  particle_morphology:
    enabled: false

galaxygenius_stamps:
  enabled: false

time_delays:
  enabled: false

lens_class_distribution:
  enabled: true
  single_field:
    fraction: 0.25
  group:
    fraction: 0.55
  binary_sie_sie:
    fraction: 0.20
  binary_nfw_nfw:
    fraction: 0.0
  binary_shear_only:
    fraction: 0.0

environment:
  types:
    group:
      fraction: 0.55
      # Overdensity vs isolated: richness_mult = 2.2/2.5 ≈ 0.88 wait —
      # galaxy_count_mean is divided by 2.5 reference. Use 4.5 → ×1.8 overdensity.
      galaxy_count_mean: 4.5
      galaxy_count_std: 1.0
      separation_mean: 3.5
      avoid_factor: 1.2
      max_radius_arcsec: 28.0
      shear_min: 0.06
      shear_max: 0.16
    isolated_field:
      fraction: 0.25
      galaxy_count_mean: 2.5
      galaxy_count_std: 0.6
      separation_mean: 4.5
      avoid_factor: 1.2
      max_radius_arcsec: 28.0
      shear_min: 0.03
      shear_max: 0.10
    galaxy_pair:
      fraction: 0.20
      galaxy_count_mean: 3.0
      galaxy_count_std: 0.7
      separation_mean: 3.5
      avoid_factor: 1.2
      max_radius_arcsec: 28.0
      shear_min: 0.05
      shear_max: 0.14

# FP for σ + Re; blend θ_E with catalog (60/40)
fundamental_plane:
  enabled: true
  update_theta_E: true
  catalog_theta_E_weight: 0.60

output:
  unified_storage: true
  save_intermediate_rgb_jpg: true
  extended_image_fov_arcmin: 1.0
  extended_lensing_fov_arcmin: 1.0
  stacked_npy:
    enabled: false
  rgb:
    # Default: Trilogy (cleaner on sim e-/s units). use_eummy: true for MER-style Lab look.
    use_eummy: false
    use_trilogy: true
    eummy:
      # "auto": MER scales only if band units differ (real stacks); sims use 1,1,1,1
      scales: auto
      pivot: 0.15
      fr: 0.3
      saturate: 1.8
      contrast: 1.2
      sky_subtract: true
      unsharp: [1.2, 0.55, 0.08]
    trilogy:
      noiselum: 0.15
      satpercent: 0.001
      colorsatfac: 1.4
      correctbias: true
      sky_subtract: true
    arc_boost: 0.25
    # Legacy fallbacks (unused when use_eummy / use_trilogy)
    band_style_stretch: false
    soft_clip: true
    field_overlay: false
    sat_percent: 0.01
    sigma_mult: 1.2
    color_enhance: 1.0
    linked_stretch: true
    noise_level: 0.22

detector_chain:
  enabled: true
  effects:
    ipc: true
    charge_diffusion: true
    brighter_fatter: true
    nonlinearity: true
    dark_current: true
    poisson_shot_noise: true
    read_noise: true
    one_f_noise: true
    saturation: true
    prnu: true
    persistence: false
    gain_adc: true

telescope_configs:
  euclid:
    bands:
    - EUCLID_VIS
    - EUCLID_Y
    - EUCLID_J
    - EUCLID_H
    pixel_scale: 0.10
    exposure_time: 565.0
    magnitude_zero_point: 25.58
    image_size: 600
    lens_population:
      redshifts:
        lens_min: 0.30
        lens_max: 0.70
        source_min: 1.0
        source_max: 2.8
        min_delta_z: 0.5
      # Physically plausible massive group/cluster lenses
      theta_E:
        min: 1.2
        max: 6.5
        median: 2.8
        log_scatter: 0.30

add_artifacts: true
add_noise: true
save_intermediate_images: true
save_npy: true
save_jpg: true
