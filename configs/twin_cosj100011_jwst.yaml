# Twin of real COSMOS-Web lens COSJ100011+023531 (JWST NIRCam cutout)
# Real: z_l=0.706, θ_E=2.25", logM★≈9.84, binary-like pair + blue arc
# FOV ≈ 9.3" (300 px @ 0.031"/px) — matches real_jwst_rgb.jpg stamp size
#
# Run:
#   python scripts/local/run_real_lens_twin.py --telescope jwst
#   python scripts/local/run_real_lens_twin.py --telescope euclid

n_lenses: 6
n_non_lenses: 0
variations_per_base: 1
n_field_max: 8

telescope: jwst
image_size: 300
pixel_scale: 0.031

bands:
- F115W
- F150W
- F277W
- F444W

redshifts:
  lens_min: 0.65
  lens_max: 0.75
  source_min: 1.8
  source_max: 2.8
  enforce_source_behind_lens: true
  min_delta_z: 0.8

mass:
  lens_mass_min: 9.6
  lens_mass_max: 10.2
  use_mass_theta_E_correlation: false

geometry:
  visible_lensed_arcs: true
  force_caustic_source_position: true
  min_magnification: 4.0
  max_magnification: 25.0
  theta_E_hard_max: 5.0
  source_fraction_mean: 0.22
  source_fraction_sigma: 0.20
  source_fraction_min: 0.08
  source_fraction_max: 0.40
  lens_radius_min: 0.25
  lens_radius_max: 1.2
  enforce_source_smaller_than_lens: true
  max_source_to_lens_ratio: 0.85

field:
  # Sparse companions in a ~9" stamp (real cutout is nearly empty aside from pair+arc)
  density_mag_limit: 24.0
  avoid_center_arcsec: 0.8
  min_pair_separation_arcsec: 0.3
  max_fraction_of_half_size: 0.90
  size_max_arcsec: 0.8
  min_count: 0

photometry:
  # Match measured AB mags (lens ≈ source in F115W; lens redder in F277/F444)
  lens_mag_min: 18.0
  lens_mag_max: 21.0
  lens_base_mag_zero: 20.5
  lens_redshift_log_slope: 0.0
  use_catalog_lens_mags: false
  source_mag_min: 19.5
  source_mag_max: 21.5
  min_source_fainter_than_lens_mag: -0.5
  max_source_fainter_than_lens_mag: 1.0
  visible_arc_mag_diff_max: 1.0
  visible_arc_source_mag_max: 21.2
  source_mag_diff_min: -0.3
  source_mag_diff_max: 0.8
  source_base_mag: 20.6
  field_mag_limit: 25.0

morphology:
  multicomponent_enabled: true
  apply_to_lens: true
  apply_to_source: true
  bt_fractions:
    elliptical: 0.92
    s0: 0.85
    spiral: 0.25

lens_morphology:
  force_morph_type: elliptical
  min_lens_sersic: 3.5

tng_mode:
  enabled: false

galaxygenius_stamps:
  enabled: false

time_delays:
  enabled: false

lens_class_distribution:
  enabled: true
  single_field:
    fraction: 0.0
  group:
    fraction: 0.0
  binary_sie_sie:
    fraction: 1.0
  binary_nfw_nfw:
    fraction: 0.0
  binary_shear_only:
    fraction: 0.0

binary_lenses:
  enabled: true
  mass_ratio:
    min: 0.35
    max: 0.85
  separation:
    min_in_einstein_radii: 0.4
    max_in_einstein_radii: 1.2

environment:
  types:
    galaxy_pair:
      fraction: 1.0
      galaxy_count_mean: 2.5
      galaxy_count_std: 0.5
      separation_mean: 1.5
      avoid_factor: 1.0
      max_radius_arcsec: 4.5
      shear_min: 0.04
      shear_max: 0.12

fundamental_plane:
  enabled: true
  update_theta_E: true
  catalog_theta_E_weight: 0.75

output:
  unified_storage: true
  save_intermediate_rgb_jpg: true
  stacked_npy:
    enabled: false
  rgb:
    field_overlay: true
    field_overlay_snr: 3.5
    sat_percent: 0.05
    sigma_mult: 0.8
    soft_clip: false
    color_enhance: 1.15
    arc_boost: 0.35
    linked_stretch: true

detector_chain:
  enabled: true

telescope_configs:
  jwst:
    bands: ["F115W", "F150W", "F277W", "F444W"]
    pixel_scale: 0.031
    image_size: 300
    lens_population:
      redshifts:
        lens_min: 0.65
        lens_max: 0.75
        source_min: 1.8
        source_max: 2.8
        min_delta_z: 0.8
      theta_E:
        min: 1.8
        max: 2.8
        median: 2.25
        log_scatter: 0.12

add_artifacts: true
add_noise: true
save_intermediate_images: true
save_npy: true
save_jpg: true
