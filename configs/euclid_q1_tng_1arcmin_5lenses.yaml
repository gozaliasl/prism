# Euclid Q1 + TNG: 5 lens systems in 1′×1′ FOV @ 0.10″/pix (600×600)
# All field galaxies matched to TNG (TNG100+TNG50); sparse cutouts OK for field.
# Massive quiescent elliptical lenses from TNG particle morphology.

n_lenses: 5
n_non_lenses: 0
variations_per_base: 1
n_field_max: 900

telescope: euclid

euclid_q1:
  enabled: true
  data_dir: /Volumes/exthd-prism/prism-data/psf/euclid_q1
  use_empirical_psf: true
  use_population_priors: true
  use_q1_photometry: true
  use_q1_shear: true
  resample_theta_E: true
  shear_range:
    min: 0.02
    max: 0.20

multi_resolution:
  enabled: false

bands:
- EUCLID_VIS
- EUCLID_Y
- EUCLID_J
- EUCLID_H

field:
  expected_density_per_arcsec2: 1.5
  avoid_center_arcsec: 0.25
  min_pair_separation_arcsec: 0.06
  max_fraction_of_half_size: 0.95
  min_count: 5
  size_max_arcsec: 2.0
  size_max_fraction_of_lens: 0.8

photometry:
  lens_mag_min: 18.5
  lens_mag_max: 23.5
  source_mag_min: 20.0
  source_mag_max: 27.0
  min_source_fainter_than_lens_mag: 1.0
  source_mag_diff_min: 1.0
  source_mag_diff_max: 3.5

morphology:
  multicomponent_enabled: true
  apply_to_lens: true
  apply_to_source: true

tng_mode:
  enabled: true
  sim_mode: tng_mixed
  local_catalog_path: /Volumes/exthd-prism/prism-data/catalogs/tng/tng_local_catalog/tng100-1_local_catalog.parquet
  local_catalog_path_tng50: /Volumes/exthd-prism/prism-data/catalogs/tng/tng_local_catalog/tng50-1_local_catalog.parquet
  logM_tol: 0.5
  max_attempts: 20
  require_local_particles: true
  lens_sfr_class: quiescent
  source_logM_default: 9.5
  source_logM_scatter: 0.5
  field_enabled: true
  field_fraction: 1.0
  field_logM_default: 9.2
  field_logM_scatter: 0.7
  environment_drives_field_count: false
  particle_morphology:
    enabled: true
    min_particles: 200
    min_particles_field: 50
    lens_enabled: true
    lens_fraction: 1.0
    source_enabled: true
    source_fraction: 1.0
    source_smooth_sigma: 1.2
    field_enabled: true
    field_fraction: 1.0
    companion_enabled: false
    companion_fraction: 0.0

galaxygenius_stamps:
  enabled: false

time_delays:
  enabled: false

lens_class_distribution:
  enabled: true
  single_field:
    fraction: 1.0
  group:
    fraction: 0.0
  binary_sie_sie:
    fraction: 0.0
  binary_nfw_nfw:
    fraction: 0.0
  binary_shear_only:
    fraction: 0.0

output:
  unified_storage: true
  save_intermediate_rgb_jpg: true
  extended_image_fov_arcmin: 1.0
  extended_lensing_fov_arcmin: 1.0
  stacked_npy:
    enabled: true

detector_chain:
  enabled: true
  effects:
    ipc: true
    charge_diffusion: true
    brighter_fatter: true
    nonlinearity: true
    dark_current: true
    poisson_shot_noise: true
    read_noise: true
    one_f_noise: true
    saturation: true
    prnu: true
    persistence: false
    gain_adc: true

telescope_configs:
  euclid:
    bands:
    - EUCLID_VIS
    - EUCLID_Y
    - EUCLID_J
    - EUCLID_H
    pixel_scale: 0.10
    exposure_time: 565.0
    magnitude_zero_point: 25.58
    image_size: 600
    lens_population:
      redshifts:
        lens_min: 0.2
        lens_max: 1.1
        source_min: 1.0
        source_max: 4.0
        min_delta_z: 0.4
      theta_E:
        min: 0.45
        max: 2.4
        median: 0.88
        log_scatter: 0.35

add_artifacts: true
add_noise: true
save_intermediate_images: true
save_npy: true
save_jpg: true
