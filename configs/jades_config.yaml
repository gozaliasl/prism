# ============================================================================
# JADES (JWST Advanced Deep Extragalactic Survey) configuration
#
# Reference: Eisenstein et al. 2023 (arXiv:2306.02465), "Overview of JADES"
#            Rieke et al. 2023a (NIRCam imaging paper, JADES DR)
#
# JADES NIRCam imaging covers GOODS-S and GOODS-N in a 3-tier "wedding cake"
# strategy:
#   - Deepest: ~9 arcmin^2  (overlapping Deep pointings)
#   - Deep:    ~33 arcmin^2 (GOODS-S only, 9 filters incl. F335M/F410M)
#   - Medium:  ~167 arcmin^2 (8-10 filters, GOODS-S + GOODS-N)
#
# Full JADES NIRCam filter set (9-10 filters):
#   F070W (Medium parallels only), F090W, F115W, F150W, F200W   (SW channel)
#   F277W, F335M, F356W, F410M, F444W                            (LW channel)
#
# This config simulates 8 of the 9-10 JADES filters:
#   F070W, F090W, F115W, F150W, F200W, F277W, F356W, F444W
# F115W/F150W/F277W/F444W use real COSMOS-Web-derived WebbPSF kernels
# (/Volumes/exthd-prism/prism-data/psf/jwst_v5_30mas). F070W/F090W/F200W/F356W use analytic Gaussian PSF
# kernels (FWHM-matched, generated via
# scripts/local/generate_extra_jades_psf_kernels.py) since no WebbPSF
# environment is available here -- adequate for noise/depth-level dataset
# generation but lacks diffraction rings/spikes.
# The two medium-band filters (F335M, F410M) are not yet included (would
# need both PSF kernels and dedicated medium-band noise calibration).
# Noise properties (background_level/rms, read_noise) for F070W/F090W/
# F200W/F356W are interpolated/extrapolated in log(wavelength) from the
# empirical F115W/F150W/F277W/F444W values (configs/default_config.yaml).
#
# Pixel scale: 0.03"/px (drizzled JADES mosaics; Eisenstein+2023 Sec 4)
#
# 10-sigma point-source depths (0.2" aperture, on-sky, "Deep" 33 arcmin^2 tier,
# Table 4 of Eisenstein+2023):
#   F090W: 29.42   F115W: 29.67   F150W: 29.61   F200W: 29.60
#   F277W: 29.90   F335M: 29.24   F356W: 29.80   F410M: 29.17   F444W: 29.44
# (5-sigma depths are ~0.75 mag brighter, i.e. ~28.4-29.2 -- matches the
#  often-quoted "Medium" 28.6-29.0 mag limiting magnitudes; "Deepest" 9 arcmin^2
#  reaches ~30.0-30.7 5-sigma.)
#
# PSF FWHM (empirical, NIRCam, arcsec):
#   F090W ~0.034   F115W ~0.040   F150W ~0.050   F200W ~0.066
#   F277W ~0.092   F335M ~0.111   F356W ~0.114   F410M ~0.132   F444W ~0.140
#
# exposure_time below (200 ks) is set to approximate the JADES Deep/Deepest
# 5-sigma depth (~30.2-30.7 AB) for the simulated bands, given the same
# NIRCam zero point/sky-background rates as the COSMOS-Web-calibrated noise
# model (signal and background both scale with exposure_time, so SNR scales
# as ~sqrt(t_exp); COSMOS-Web depth ~27.5 AB @ 1028s -> ~30.4 AB @ 200 ks).
#
# Source population: JADES targets very high-redshift (z ~ 4-15) star-forming
# galaxies behind foreground massive ellipticals (z ~ 0.3-2). The global
# redshift/mass/theta_E settings below (calibrated to JWST/COSMOS-Web strong
# lenses) are used unchanged; lens_population overrides (as added for Euclid)
# can be added later if JADES-specific lens statistics are required.
# ============================================================================

n_lenses: 10000
n_non_lenses: 0
variations_per_base: 23
n_field_max: 5
ml_training:
  standard:
    n_lenses: 50000
    n_non_lenses: 50000
    variations_per_base: 115
    description: Standard ML training dataset with empirical variations
  large_scale:
    n_lenses: 100000
    n_non_lenses: 100000
    variations_per_base: 230
    description: Large-scale ML training dataset for robust models
  quick:
    n_lenses: 10000
    n_non_lenses: 10000
    variations_per_base: 23
    description: Quick ML training dataset for testing
  production:
    n_lenses: 5000
    n_non_lenses: 5000
    variations_per_base: 12
    description: Production dataset for paper validation
image_size: 300
pixel_scale: 0.03
multi_resolution:
  enabled: false
  scales:
  - name: ground_based
    pixel_scale: 0.2
    description: Ground-based resolution
  - name: roman
    pixel_scale: 0.11
    description: Roman Space Telescope resolution
  - name: euclid
    pixel_scale: 0.1
    description: Medium resolution (Euclid)
  - name: jwst
    pixel_scale: 0.031
    description: High resolution (JWST)
sersic_range:
- 0.3
- 6.0
magnitude_range:
- 18.0
- 28.0
photometry:
  lens_mag_min: 18.0
  lens_mag_max: 24.0
  source_mag_min: 19
  source_mag_max: 27.5
  min_source_fainter_than_lens_mag: 1.2
  source_mag_diff_min: 1.5
  source_mag_diff_max: 5.0
  lens_base_mag_zero: 21.0
  lens_redshift_log_slope: 0.8
  source_base_mag: 20.5
catalogs:
  galaxy_catalog: /Volumes/exthd-prism/prism-data/catalogs/cosmos/galaxy_catalog.fits
geometry:
  lens_radius_min: 0.35
  lens_radius_max: 2.2
  use_catalog_lens_radius: true
  frame_radius_max_arcsec: 4.5
  min_environment_avoidance_arcsec: 0.35
  lens_size_scaling:
    r0_kpc: 5.2
    alpha_mass: 0.75
    beta_redshift: -1.2
    reference_mass: 11.2
    reference_z: 0.6
    mix_catalog_weight: 0.35
    kpc_min: 1.2
    kpc_max: 18.0
    log_scatter: 0.18
  source_fraction_mean: 0.12
  source_fraction_sigma: 0.45
  source_fraction_min: 0.02
  source_fraction_max: 0.4
  enforce_source_smaller_than_lens: true
  max_source_to_lens_ratio: 0.6
  allow_magnified_arcs_larger_than_lens: true
redshifts:
  lens_min: 0.3
  lens_max: 3.5
  source_min: 1.0
  source_max: 6.0
  enforce_source_behind_lens: true
  min_delta_z: 0.5
mass:
  lens_mass_min: 10.0
  lens_mass_max: 12.0
  use_mass_theta_E_correlation: true
subhalos:
  enabled: false
  count_range:
  - 3
  - 12
  mass_function_slope: 1.9
  mass_range_log10_host:
  - -4.5
  - -2.0
  mass_fraction_of_host: 0.01
  concentration_relation: duffy2008
  max_radius_einstein_units: 3.0
  profile: NFW
binary_lenses:
  enabled: true
  fraction: 0.35
  mass_profile_types:
    sie_sie: 0.5
    nfw_nfw: 0.5
  mass_ratio:
    min: 0.3
    max: 1.0
    distribution: uniform
  separation:
    min_in_einstein_radii: 0.5
    max_in_einstein_radii: 2.0
    distribution: uniform
  redshift_config:
    same_redshift_fraction: 0.8
    max_delta_z: 0.3
  orientation:
    random_position_angle: true
    correlated_ellipticities: true
lens_class_distribution:
  enabled: true
  single_field:
    fraction: 0.45
    description: Single field galaxy lens (SIE or NFW + optional shear)
  group:
    fraction: 0.2
    description: Group lens with multiple different mass profile types
  binary_sie_sie:
    fraction: 0.175
    description: 'Binary pair: two smooth isothermal spheres'
  binary_nfw_nfw:
    fraction: 0.175
    description: 'Binary pair: two NFW mass profiles'
  binary_shear_only:
    fraction: 0.0
    description: 'Binary pair: SIE primary plus a secondary modeled as pure external
      shear'
mass_size:
  lens_relation_mix:
    cowls_fraction: 0.4
    cwmgs_fraction: 0.6
  fallback_global:
    slope: 0.387
    intercept: -3.843
    size_evolution_exponent: -0.2
environment:
  types:
    isolated_field:
      fraction: 0.45
      galaxy_count_mean: 2.5
      galaxy_count_std: 1.2
      min_galaxies: 0
      max_galaxies: 3
      poisson_lambda: 1.4
      separation_mean: 2.5
      avoid_factor: 1.25
      max_radius_arcsec: 3.0
      shear_min: 0.01
      shear_max: 0.05
    galaxy_pair:
      fraction: 0.35
      galaxy_count_mean: 3.0
      galaxy_count_std: 1.3
      min_galaxies: 1
      max_galaxies: 4
      separation_mean: 1.8
      avoid_factor: 1.1
      max_radius_arcsec: 3.5
      shear_min: 0.03
      shear_max: 0.08
    group:
      fraction: 0.2
      galaxy_count_mean: 4.5
      galaxy_count_std: 1.6
      min_galaxies: 2
      max_galaxies: 5
      separation_mean: 1.2
      avoid_factor: 1.0
      max_radius_arcsec: 4.0
      shear_min: 0.05
      shear_max: 0.15
field:
  expected_density_per_arcsec2: 1.5
  avoid_center_arcsec: 0.3
  min_pair_separation_arcsec: 0.08
  max_fraction_of_half_size: 0.9
  min_count: 1
  size_max_arcsec: 1.2
  size_max_fraction_of_lens: 0.6
strict_catalog:
  use_catalog_only:
    lens: true
    source: true
    field: true
  required_fields:
  - lens_redshift
  - theta_E
  missing_policy: synthesize
  synthesize:
    magnitudes: true
    theta_E: true
    geometry: true
bands:
- F070W
- F090W
- F115W
- F150W
- F200W
- F277W
- F356W
- F444W
band_presets:
  default:
    filters:
    - F115W
    - F150W
    - F277W
    - F444W
    description: Standard 4-band JWST (NIRCam) - DEFAULT
  thesis_multi_filter:
    filters:
    - F090W
    - F150W
    - F200W
    - F356W
    - F444W
    description: 5-band for color/redshift impact studies (Aaron's thesis)
  short_wavelength:
    filters:
    - F115W
    - F150W
    description: Short wavelength only (high-z optimization)
  long_wavelength:
    filters:
    - F277W
    - F356W
    - F444W
    description: Long wavelength only (dust/redshift penetration)
band_centers:
  F090W: 0.9
  F115W: 1.15
  F150W: 1.5
  F200W: 2.0
  F277W: 2.77
  F356W: 3.56
  F444W: 4.44
exposure_time: 3000.0
magnitude_zero_point: 28.09
noise:
  sampling_method: distribution
  F070W:
    sky_brightness: 32.34
    background_level: 1.79e-05
    background_rms: 0.0417
    read_noise: 0.0294
  F090W:
    sky_brightness: 31.19
    background_level: 5.17e-05
    background_rms: 0.0343
    read_noise: 0.02416
  F115W:
    sky_brightness: 30.07
    background_level: 0.0001448
    background_rms: 0.0283
    read_noise: 0.01996
  F150W:
    sky_brightness: 28.86
    background_level: 0.0004446
    background_rms: 0.023
    read_noise: 0.01623
  F200W:
    sky_brightness: 28.47
    background_level: 6.36e-04
    background_rms: 0.01438
    read_noise: 0.01006
  F277W:
    sky_brightness: 28.02
    background_level: 0.000956
    background_rms: 0.00849
    read_noise: 0.0059
  F356W:
    sky_brightness: 28.03
    background_level: 9.484e-04
    background_rms: 0.00924
    read_noise: 0.00644
  F444W:
    sky_brightness: 28.04
    background_level: 0.00094
    background_rms: 0.01007
    read_noise: 0.00704
read_noise: 12.0
sky_brightness: 27.0
output_dir: outputs
save_npy: true
save_jpg: true
save_catalogs: true
save_intermediate_images: false
output:
  unified_storage: true
  skip_empty_images: true
  min_total_flux: 1.0e-07
  min_source_flux: 1.0e-08
  save_intermediate_rgb_jpg: true
  stacked_npy:
    enabled: true
    order:
    - lens_only
    - sources_only
    - lens_sources
    - field_only
    - final
add_artifacts: true
add_noise: true
verify_output: true
telescope: jwst
fundamental_plane:
  enabled: true
detector_chain:
  enabled: true
  effects:
    ipc: true
    charge_diffusion: true
    brighter_fatter: true
    nonlinearity: true
    dark_current: true
    poisson_shot_noise: true
    read_noise: true
    one_f_noise: true
    saturation: true
    prnu: true
    persistence: false
    gain_adc: true
telescope_configs:
  roman:
    bands:
    - ROMAN_F106
    - ROMAN_F129
    - ROMAN_F158
    - ROMAN_F184
    pixel_scale: 0.11
    exposure_time: 146.0
    magnitude_zero_point: 28.09
    image_size: 128
  euclid:
    bands:
    - EUCLID_VIS
    - EUCLID_Y
    - EUCLID_J
    - EUCLID_H
    pixel_scale: 0.1
    exposure_time: 565.0
    magnitude_zero_point: 25.58
    image_size: 128
    lens_population:
      redshifts:
        lens_min: 0.2
        lens_max: 1.1
        source_min: 1.0
        source_max: 4.0
        min_delta_z: 0.4
      theta_E:
        min: 0.3
        max: 2.4
        median: 0.95
        log_scatter: 0.4
      velocity_dispersion:
        min: 180.0
        max: 335.0
      detected_fraction: 0.7
      extended_theta_E:
        min: 0.05
        max: 2.4
        median: 0.45
        log_scatter: 0.6
      extended_redshifts:
        lens_min: 0.1
        lens_max: 3.0
        source_min: 1.0
        source_max: 6.0
        min_delta_z: 0.3
  subaru:
    bands:
    - SUBARU_G
    - SUBARU_R
    - SUBARU_I
    - SUBARU_Z
    pixel_scale: 0.168
    exposure_time: 600.0
    magnitude_zero_point: 27.9
    image_size: 128
  lsst:
    bands:
    - LSST_G
    - LSST_R
    - LSST_I
    - LSST_Z
    pixel_scale: 0.2
    exposure_time: 30.0
    magnitude_zero_point: 27.79
    image_size: 128
    coadd_visits: 1
artifacts:
  cosmic_rays: true
  hot_pixels: true
  saturation: true
  intensity: moderate
time_delays:
  enabled: true
  fraction_variable_sources: 0.1
  source_types:
    quasar:
      fraction: 0.6
      variability_amplitude: 1.5
      variability_timescale: 50.0
      use_drw: true
      black_hole_mass: null
    supernova:
      fraction: 0.25
      variability_amplitude: 2.0
      variability_timescale: 18.0
      use_sncosmo: true
      sn_type: Ia
    agn:
      fraction: 0.15
      variability_amplitude: 1.2
      variability_timescale: 40.0
      use_drw: true
      black_hole_mass: null
  epochs:
    min_epochs: 4
    max_epochs: 4
    time_range_days: 200
    random_epochs: false
    optimize_epochs: true
  catalog:
    save_time_delay_metadata: true
    include_light_curves: false
