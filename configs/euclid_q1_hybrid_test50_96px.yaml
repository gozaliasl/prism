# Euclid Q1 hybrid test: 50 lenses, 96×96 @ 0.10"/pix (9.6″ FOV)
# COSMOS Sersic/multicomponent field + selective TNG particles (lens/source)

n_lenses: 50
n_non_lenses: 0
variations_per_base: 1
n_field_max: 20

image_size: 96
pixel_scale: 0.10

telescope: euclid

euclid_q1:
  enabled: true
  data_dir: /Volumes/exthd-prism/prism-data/psf/euclid_q1
  use_empirical_psf: true
  use_population_priors: true
  use_q1_photometry: true
  use_q1_shear: true
  resample_theta_E: true
  shear_range:
    min: 0.02
    max: 0.18

multi_resolution:
  enabled: false

bands:
- EUCLID_VIS
- EUCLID_Y
- EUCLID_J
- EUCLID_H

geometry:
  visible_lensed_arcs: true
  force_caustic_source_position: true
  min_magnification: 4.0
  max_magnification: 18.0
  source_fraction_mean: 0.20
  source_fraction_sigma: 0.35
  lens_radius_min: 0.35
  lens_radius_max: 1.8

field:
  density_mag_limit: 24.5
  expected_density_per_arcsec2: 0.025
  avoid_center_arcsec: 0.25
  min_pair_separation_arcsec: 0.08
  min_count: 2

photometry:
  lens_mag_min: 18.5
  lens_mag_max: 23.5
  source_mag_min: 19.0
  source_mag_max: 22.5
  min_source_fainter_than_lens_mag: 0.4
  max_source_fainter_than_lens_mag: 1.5
  visible_arc_mag_diff_max: 1.2
  visible_arc_source_mag_max: 21.0
  source_mag_diff_min: 0.5
  source_mag_diff_max: 3.0
  field_mag_limit: 24.5

morphology:
  multicomponent_enabled: true
  apply_to_lens: true
  apply_to_source: true

tng_mode:
  enabled: true
  sim_mode: tng_mixed
  local_catalog_path: /Volumes/exthd-prism/prism-data/catalogs/tng/tng_local_catalog/tng100-1_local_catalog.parquet
  local_catalog_path_tng50: /Volumes/exthd-prism/prism-data/catalogs/tng/tng_local_catalog/tng50-1_local_catalog.parquet
  logM_tol: 0.5
  max_attempts: 20
  require_local_particles: false
  lens_sfr_class: quiescent
  source_logM_default: 9.5
  source_logM_scatter: 0.5
  field_enabled: true
  field_fraction: 0.25
  field_override_structural: false
  field_logM_default: 9.0
  field_logM_scatter: 0.75
  environment_drives_field_count: true
  particle_morphology:
    enabled: true
    min_particles: 200
    min_particles_field: 50
    lens_enabled: true
    lens_fraction: 0.80
    source_enabled: true
    source_fraction: 0.45
    source_smooth_sigma: 1.0
    field_enabled: true
    field_fraction: 0.18
    companion_enabled: true
    companion_fraction: 0.5

galaxygenius_stamps:
  enabled: false

time_delays:
  enabled: false

lens_class_distribution:
  enabled: true
  single_field:
    fraction: 0.50
  group:
    fraction: 0.20
  binary_sie_sie:
    fraction: 0.15
  binary_nfw_nfw:
    fraction: 0.15
  binary_shear_only:
    fraction: 0.0

environment:
  types:
    isolated_field:
      fraction: 0.45
      galaxy_count_mean: 2.5
      galaxy_count_std: 1.2
      shear_min: 0.02
      shear_max: 0.08
    galaxy_pair:
      fraction: 0.35
      galaxy_count_mean: 3.0
      galaxy_count_std: 1.3
      shear_min: 0.03
      shear_max: 0.12
    group:
      fraction: 0.20
      galaxy_count_mean: 4.5
      galaxy_count_std: 1.4
      shear_min: 0.04
      shear_max: 0.15

fundamental_plane:
  enabled: true

output:
  unified_storage: true
  save_intermediate_rgb_jpg: true
  stacked_npy:
    enabled: true

detector_chain:
  enabled: true
  effects:
    ipc: true
    charge_diffusion: true
    brighter_fatter: true
    nonlinearity: true
    dark_current: true
    poisson_shot_noise: true
    read_noise: true
    one_f_noise: true
    saturation: true
    prnu: true
    persistence: false
    gain_adc: true

telescope_configs:
  euclid:
    bands:
    - EUCLID_VIS
    - EUCLID_Y
    - EUCLID_J
    - EUCLID_H
    pixel_scale: 0.10
    exposure_time: 565.0
    magnitude_zero_point: 25.58
    image_size: 96
    lens_population:
      redshifts:
        lens_min: 0.2
        lens_max: 1.1
        source_min: 1.0
        source_max: 4.0
        min_delta_z: 0.4
      theta_E:
        min: 0.45
        max: 2.4
        median: 0.88
        log_scatter: 0.35

add_artifacts: true
add_noise: true
save_intermediate_images: true
save_npy: true
save_jpg: true
