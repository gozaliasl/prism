# Batch TNG run for presentation: 10 lenses, brighter field galaxies, richer source morphology
n_lenses: 10
n_non_lenses: 0
variations_per_base: 1
n_field_max: 5
image_size: 300
pixel_scale: 0.031
bands:
- F115W
- F150W
- F277W
- F444W
sersic_range: [0.3, 6.0]
magnitude_range: [18.0, 24.5]
morphology:
  multicomponent_enabled: false
photometry:
  lens_mag_min: 18.5
  lens_mag_max: 22.5
  source_mag_min: 19.5
  source_mag_max: 24.0
  min_source_fainter_than_lens_mag: 0.5
  source_mag_diff_min: 0.5
  source_mag_diff_max: 3.0
  lens_base_mag_zero: 21.0
  lens_redshift_log_slope: 0.8
  source_base_mag: 21.0
geometry:
  max_magnification: 12.0
  min_magnification: 2.0
  lens_radius_min: 0.5
  lens_radius_max: 2.5
  use_catalog_lens_radius: true
  frame_radius_max_arcsec: 4.5
  min_environment_avoidance_arcsec: 0.3
  lens_size_scaling:
    r0_kpc: 5.2
    alpha_mass: 0.75
    beta_redshift: -1.2
    reference_mass: 11.2
    reference_z: 0.6
    mix_catalog_weight: 0.35
    kpc_min: 1.2
    kpc_max: 18.0
    log_scatter: 0.18
  source_fraction_mean: 0.15
  source_fraction_sigma: 0.45
  source_fraction_min: 0.03
  source_fraction_max: 0.5
  enforce_source_smaller_than_lens: true
  max_source_to_lens_ratio: 0.7
  allow_magnified_arcs_larger_than_lens: true
redshifts:
  lens_min: 0.3
  lens_max: 1.5
  source_min: 0.7
  source_max: 3.0
  enforce_source_behind_lens: true
  min_delta_z: 0.4
mass:
  lens_mass_min: 10.8
  lens_mass_max: 12.0
  use_mass_theta_E_correlation: true
catalogs:
  galaxy_catalog: /Volumes/exthd-prism/prism-data/catalogs/cosmos/galaxy_catalog.fits
lens_class_distribution:
  enabled: true
  single_field:
    fraction: 1.0
    description: Single SIE lens
  group:
    fraction: 0.0
  binary_sie_sie:
    fraction: 0.0
  binary_nfw_nfw:
    fraction: 0.0
  binary_shear_only:
    fraction: 0.0
environment:
  types:
    isolated_field:
      fraction: 1.0
      galaxy_count_mean: 3.5
      galaxy_count_std: 1.0
      min_galaxies: 3
      max_galaxies: 5
      poisson_lambda: 2.0
      separation_mean: 2.2
      avoid_factor: 1.1
      max_radius_arcsec: 3.5
      shear_min: 0.01
      shear_max: 0.05
    galaxy_pair:
      fraction: 0.0
      galaxy_count_mean: 3.0
      galaxy_count_std: 1.3
      min_galaxies: 1
      max_galaxies: 4
      separation_mean: 1.8
      avoid_factor: 1.1
      max_radius_arcsec: 3.5
      shear_min: 0.03
      shear_max: 0.08
    group:
      fraction: 0.0
      galaxy_count_mean: 4.5
      galaxy_count_std: 1.6
      min_galaxies: 2
      max_galaxies: 5
      separation_mean: 1.2
      avoid_factor: 1.0
      max_radius_arcsec: 4.0
      shear_min: 0.05
      shear_max: 0.15
tng_mode:
  enabled: true
  sim_mode: tng_mixed
  local_catalog_path: /Volumes/exthd-prism/prism-data/catalogs/tng/tng_local_catalog/tng100-1_local_catalog.parquet
  local_catalog_path_tng50: /Volumes/exthd-prism/prism-data/catalogs/tng/tng_local_catalog/tng50-1_local_catalog.parquet
  logM_tol: 0.6           # wider tolerance draws from more subhalos
  delta_z_window: 0.5     # pool all TNG snapshots within Δz=0.5 of target
  max_attempts: 30
  require_local_particles: true
  source_logM_default: 9.5
  source_logM_scatter: 0.8   # wider scatter → diverse source masses
  field_enabled: true
  field_fraction: 1.0
  field_logM_default: 9.8
  field_logM_scatter: 0.8
  environment_drives_field_count: true
  particle_morphology:
    enabled: true
    min_particles: 500
    lens_enabled: true
    lens_fraction: 1.0
    source_enabled: true
    source_fraction: 1.0
    source_smooth_sigma: 1.2
    field_enabled: true
    field_fraction: 1.0
    companion_enabled: false
    companion_fraction: 0.0
    generative_enabled: false
    generative_force: false
strict_catalog:
  use_catalog_only:
    lens: true
    source: true
    field: true
  required_fields:
  - lens_redshift
  - theta_E
  missing_policy: synthesize
  synthesize:
    magnitudes: true
    theta_E: true
    geometry: true
noise:
  sampling_method: distribution
  F115W:
    sky_brightness: 30.07
    background_level: 0.0001448
    background_rms: 0.0283
    read_noise: 0.01996
  F150W:
    sky_brightness: 28.86
    background_level: 0.0004446
    background_rms: 0.023
    read_noise: 0.01623
  F277W:
    sky_brightness: 28.02
    background_level: 0.000956
    background_rms: 0.00849
    read_noise: 0.0059
  F444W:
    sky_brightness: 28.04
    background_level: 0.00094
    background_rms: 0.01007
    read_noise: 0.00704
read_noise: 12.0
sky_brightness: 27.0
exposure_time: 1028.0
magnitude_zero_point: 28.09
output_dir: /Volumes/exthd-prism/prism-data/outputs/presentation_tng_batch
save_npy: false
save_jpg: true
save_catalogs: true
save_intermediate_images: true
output:
  unified_storage: true
  skip_empty_images: false
  min_total_flux: 1.0e-08
  min_source_flux: 1.0e-09
  save_intermediate_rgb_jpg: true
  stacked_npy:
    enabled: false
add_artifacts: false
add_noise: true
verify_output: true
telescope: jwst
fundamental_plane:
  enabled: true
detector_chain:
  enabled: true
  effects:
    ipc: true
    charge_diffusion: true
    brighter_fatter: false
    nonlinearity: false
    dark_current: true
    poisson_shot_noise: true
    read_noise: true
    one_f_noise: false
    saturation: false
    prnu: false
    persistence: false
    gain_adc: true
subhalos:
  enabled: false
binary_lenses:
  enabled: false
time_delays:
  enabled: false
galaxygenius_stamps:
  enabled: false
