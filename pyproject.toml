[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-lensing"
version = "0.1.0"
description = "PRISM: a multi-telescope physically realistic strong lensing image simulation (JWST, Euclid, Roman, Rubin/LSST, Subaru)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ghassem Gozaliasl" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "astropy>=5.0.0",
    "lenstronomy>=1.11.0",
    "pyyaml>=6.0",
    "tqdm>=4.62.0",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest>=6.0", "black>=21.0", "flake8>=3.9"]

[project.scripts]
prism-simulate = "prism.core.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prism*"]

[tool.setuptools.package-data]
"prism.morphology" = ["*.yaml", "*.md"]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that require a full prism-simulate render (run manually, not in CI)",
]
